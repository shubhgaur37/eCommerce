services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2

    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}

      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    mem_limit: 1g

    volumes:
      - elastic_search_data:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2

    depends_on:
      elasticsearch:
        condition: service_started

    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}

      - KIBANA_PASSWORD=${KIBANA_PASSWORD}

    command:
      - bash
      - -c
      - |
        echo "Setup container started"
    
        until curl -s \
          -u elastic:$${ELASTIC_PASSWORD} \
          http://elasticsearch:9200 \
          | grep -q "cluster_name";
        do
          echo "Waiting for Elasticsearch..."
          sleep 5
        done
    
        echo "Elasticsearch is ready"
    
        until curl -s -X POST \
          -u elastic:$${ELASTIC_PASSWORD} \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" \
          | grep -q "^{}";
        do
          echo "Retrying Kibana password setup..."
          sleep 5
        done
    
        echo "Kibana system password configured"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.2

    container_name: logstash

    depends_on:
      elasticsearch:
        condition: service_started

    volumes:
      - ./infrastructure_config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

      - ./logs:/logs:ro

    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2

    container_name: kibana

    depends_on:
      setup:
        condition: service_completed_successfully

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

      - ELASTICSEARCH_USERNAME=kibana_system

      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}

    ports:
      - "5601:5601"

volumes:

  elastic_search_data: