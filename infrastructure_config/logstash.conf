input {
  file {
    path => "/logs/*/application-*.log"

    start_position => "beginning"
  }
}

output {
  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "ecommerce-spring-boot-logs-%{+YYYY.MM.dd}"

    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }

  stdout {
    codec => rubydebug
  }
}