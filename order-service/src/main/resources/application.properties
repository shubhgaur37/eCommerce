spring.application.name=order-service

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.kafka.bootstrap-servers=localhost:29092

kafka.topic.OrderCreatedItemsTopic=OrderCreatedItemsTopic

kafka.topic.OrderConfirmedTopic=OrderConfirmedTopic

spring.kafka.consumer.group-id=order-service

kafka.consumer.order_creation.group.id=order-creation-consumer

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.template.observation-enabled=true

spring.kafka.listener.observation-enabled=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081

spring.kafka.consumer.properties.specific.avro.reader=true